name: Payment Service CI/CD Pipeline

on:
  push:
    paths:
      - "Payment-service/**"
      - "k8s/payment-service/**"
      - ".github/workflows/payment-service-ci-cd.yaml"
    branches:
      - main
  pull_request:
    paths:
      - "Payment-service/**"
      - "k8s/payment-service/**"
      - ".github/workflows/payment-service-ci-cd.yaml"

concurrency:
  group: payment-service-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: eu-west-1
      AWS_ACCOUNT_ID: 905418111634
      ECR_REPO_PREFIX: springboot-kafka-microservices
      ECR_REPOSITORY: springboot-kafka-microservices/payment-service
      CLUSTER_NAME: microservices-cluster

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Tests are the point of CI; a failure here must stop the deploy.
      - name: Build and test payment-service
        working-directory: Payment-service
        run: mvn -B clean verify

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        if: github.event_name == 'push'
        working-directory: Payment-service
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI=${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          LATEST_URI=${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest

          echo "Building $IMAGE_URI"
          docker build -t $IMAGE_URI -t $LATEST_URI .

          docker push $IMAGE_URI
          docker push $LATEST_URI

          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Deploy to EKS
        if: github.event_name == 'push'
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.CLUSTER_NAME }}

          # Apply the manifests as well as the image: config changes in
          # k8s/payment-service/ also trigger this workflow, and "set image"
          # alone would silently ignore them.
          kubectl apply -f k8s/payment-service/configmap.yaml
          kubectl apply -f k8s/payment-service/service.yaml
          kubectl apply -f k8s/payment-service/deployment.yaml

          kubectl set image deployment/payment-service payment-service=${{ env.IMAGE_URI }}
          kubectl rollout status deployment/payment-service --timeout=300s
          kubectl get pods -l app=payment-service
