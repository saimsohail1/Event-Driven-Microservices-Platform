name: Platform Commons Starter

on:
  workflow_dispatch:
  push:
    paths:
      - "platform-commons-starter/**"
      - ".github/workflows/platform-commons-starter.yaml"
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    paths:
      - "platform-commons-starter/**"
      - ".github/workflows/platform-commons-starter.yaml"

concurrency:
  group: platform-commons-starter-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Test and package
        working-directory: platform-commons-starter
        run: mvn -B clean verify

      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@v4
        with:
          name: platform-commons-starter-bom
          path: platform-commons-starter/target/bom.json
          if-no-files-found: error

      # The H2 CVE database is created on the first NVD download. A blank
      # NVD_API_KEY must not be sent (NVD 403s it). No key still works; it
      # just waits longer between pages. Cache the data dir so later runs
      # are incremental.
      - name: Cache NVD database
        uses: actions/cache@v4
        # Restored across runs so the first keyed download is the expensive one.
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-data-${{ runner.os }}
          restore-keys: |
            dependency-check-data-

      - name: OWASP dependency-check
        working-directory: platform-commons-starter
        timeout-minutes: 40
        env:
          # Do not map this onto NVD_API_KEY. An empty env var is treated as
          # an invalid key and the download dies in seconds.
          NVD_API_KEY_SECRET: ${{ secrets.NVD_API_KEY }}
        run: |
          set -euo pipefail
          unset NVD_API_KEY || true
          ARGS="-Ddependency-check.skip=false -DnvdApiDelay=8000"
          if [ -n "${NVD_API_KEY_SECRET:-}" ]; then
            echo "Using configured NVD API key"
            export NVD_API_KEY="$NVD_API_KEY_SECRET"
            ARGS="$ARGS -DnvdApiKeyEnvironmentVariable=NVD_API_KEY -DnvdApiDelay=2000"
          else
            echo "No NVD API key; downloading without one (slow, public rate limit)"
          fi
          mvn -B org.owasp:dependency-check-maven:check $ARGS

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-commons-starter-dependency-check
          path: platform-commons-starter/target/dependency-check-report.*
          if-no-files-found: ignore

      - name: Confirm tag matches the POM version
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: platform-commons-starter
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          POM=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          if [ "$TAG" != "$POM" ]; then
            echo "Tag v$TAG does not match POM version $POM"
            exit 1
          fi

      - name: Publish to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: platform-commons-starter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B deploy -DskipTests
