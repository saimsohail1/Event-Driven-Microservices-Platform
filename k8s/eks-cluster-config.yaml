apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: microservices-cluster
  region: eu-west-1
  version: "1.32"

iam:
  withOIDC: true

vpc:
  clusterEndpoints:
    publicAccess: true
    privateAccess: false

managedNodeGroups:
  - name: standard-workers
    instanceType: t3.medium
    # A single t3.medium (2 vCPU) cannot hold Kafka, ZooKeeper, the frontend and
    # two replicas of all three services once CPU requests are counted, so the
    # group starts at two nodes.
    desiredCapacity: 2
    minSize: 2
    maxSize: 4
    volumeSize: 20
    labels:
      role: worker

cloudWatch:
  clusterLogging:
    enableTypes: ["*"]
