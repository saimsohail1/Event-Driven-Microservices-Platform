apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
      - name: ecr-registry-secret
      containers:
      - name: frontend
        image: 905418111634.dkr.ecr.eu-west-1.amazonaws.com/springboot-kafka-microservices/frontend:latest
        ports:
        - containerPort: 80
          name: http
        securityContext:
          allowPrivilegeEscalation: false
        env:
        # nginx proxies the browser's /api/* calls to these in-cluster services,
        # which is why the backends need no public load balancers and the page
        # needs no CORS.
        - name: ORDER_SERVICE_URL
          value: "http://order-service"
        - name: INVENTORY_SERVICE_URL
          value: "http://inventory-service"
        - name: PAYMENT_SERVICE_URL
          value: "http://payment-service"
        resources:
          requests:
            memory: "32Mi"
            cpu: "25m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
