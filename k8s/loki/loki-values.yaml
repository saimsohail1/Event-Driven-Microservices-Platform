# Values for the grafana/loki-stack chart.
loki:
  enabled: true
  isDefault: true
  service:
    port: 3100
  persistence:
    enabled: false
    size: 10Gi
  # For a simple single-node / demo EKS cluster. Raise when running HA.
  replicas: 1

promtail:
  enabled: true
  config:
    clients:
      - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push

grafana:
  enabled: false
