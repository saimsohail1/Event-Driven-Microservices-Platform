# ClusterIP, not LoadBalancer: the frontend pod reverse-proxies /api/orders, so
# this service does not need its own public ELB.
apiVersion: v1
kind: Service
metadata:
  name: order-service
  labels:
    app: order-service
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8081
    protocol: TCP
    name: http
  selector:
    app: order-service
