apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  labels:
    app: payment-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      imagePullSecrets:
      - name: ecr-registry-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
      - name: payment-service
        image: 905418111634.dkr.ecr.eu-west-1.amazonaws.com/springboot-kafka-microservices/payment-service:latest
        ports:
        - containerPort: 8083
          name: http
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        env:
        - name: DB_URL
          valueFrom:
            configMapKeyRef:
              name: payment-service-config
              key: DB_URL
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: payment-service-config
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: payment-service-secret
              key: DB_PASSWORD
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: payment-service-config
              key: KAFKA_BOOTSTRAP_SERVERS
        resources:
          requests:
            memory: "320Mi"
            cpu: "150m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        # The startup probe absorbs JVM + Flyway boot time, so liveness and
        # readiness can react quickly once the app is up.
        startupProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8083
          periodSeconds: 5
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8083
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8083
          periodSeconds: 10
          failureThreshold: 3
