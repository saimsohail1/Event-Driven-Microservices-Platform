# ClusterIP, not LoadBalancer: the frontend pod reverse-proxies /api/payments,
# so this service does not need its own public ELB.
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  labels:
    app: payment-service
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8083
    protocol: TCP
    name: http
  selector:
    app: payment-service
